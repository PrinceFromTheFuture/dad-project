version: "3.9"

services:
  main:
    build: . # path to your Next.js app (Dockerfile should be there)
    container_name: report-flow
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URI=mongodb://mongo:27017
      - NEXT_PUBLIC_URL=http://localhost:3000
      - PAYLOAD_SECRET="fjkdshi7h3iu"
      - NEXT_PUBLIC_REMOTES_SERVER_URL=http://host.docker.internal:3001
    volumes:
      - app-data:/app/db/media
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongo_db_main
    ports:
      - "27016:27017"
    volumes:
      - ./mongo-data:/data/db

volumes:
  mongo-data:
    name: app_db_test
  app-data:
    name: app_reports
